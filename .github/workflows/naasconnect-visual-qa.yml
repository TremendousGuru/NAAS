name: NAASCONNECT post-deployment visual QA

on:
  deployment_status:

permissions:
  contents: read

jobs:
  visual-qa:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - name: Resolve exact deployment URL
        id: deployment
        env:
          ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail
          URL="${ENVIRONMENT_URL:-$TARGET_URL}"
          if [ -z "$URL" ]; then
            echo "::error::The deployment status did not provide a preview URL."
            exit 1
          fi
          node -e 'const u = new URL(process.argv[1]); if (u.protocol !== "https:") process.exit(1)' "$URL"
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Vercel preview access
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Add VERCEL_AUTOMATION_BYPASS_SECRET to GitHub Actions secrets so protected Vercel previews can be inspected."
            exit 1
          fi
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Install pinned browser test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Inspect deployed desktop and mobile experience
        run: npx playwright test
        env:
          BASE_URL: ${{ steps.deployment.outputs.base_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naasconnect-visual-qa-${{ github.run_number }}
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
