name: NAASCONNECT pre-deployment quality gate

on:
  push:
    branches:
      - feature/naasconnect-frontend-foundation

permissions:
  contents: read
  statuses: write

concurrency:
  group: naasconnect-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck and desktop/mobile smoke QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publish pending deployment gate
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              target_url: "https://github.com/TremendousGuru/NAAS/actions/workflows/naasconnect-predeploy-quality-gate.yml",
              context: "naasconnect/predeploy-quality-gate",
              description: "Running typecheck, build and browser smoke tests"
            });

      - name: Check out source
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        id: typecheck
        run: npm run typecheck

      - name: Production build
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: https://naasconnect-ci.example

      - name: Install Chromium for Playwright
        id: browser_install
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile smoke tests
        id: e2e
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: https://naasconnect-ci.example

      - name: Publish final deployment gate status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_install.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const outcomes = {
              install: process.env.INSTALL_OUTCOME,
              typecheck: process.env.TYPECHECK_OUTCOME,
              build: process.env.BUILD_OUTCOME,
              browser: process.env.BROWSER_OUTCOME,
              e2e: process.env.E2E_OUTCOME
            };
            const failed = Object.entries(outcomes).find(([, outcome]) => outcome === "failure");
            const description = state === "success"
              ? "Typecheck, production build and desktop/mobile smoke tests passed"
              : `Failed at ${failed?.[0] ?? "workflow setup"}; inspect GitHub Actions for details`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              target_url: "https://github.com/TremendousGuru/NAAS/actions/workflows/naasconnect-predeploy-quality-gate.yml",
              context: "naasconnect/predeploy-quality-gate",
              description
            });
