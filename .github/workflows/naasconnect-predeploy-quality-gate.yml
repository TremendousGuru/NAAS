name: NAASCONNECT pre-deployment quality gate

on:
  push:
    branches:
      - feature/naasconnect-frontend-foundation

permissions:
  contents: read
  statuses: write

concurrency:
  group: naasconnect-predeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, typecheck and desktop/mobile smoke QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publish pending deployment gate
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "naasconnect/predeploy-quality-gate",
              description: "Running typecheck, build and browser smoke tests"
            });

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: https://naasconnect-ci.example

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile smoke tests
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_SITE_URL: https://naasconnect-ci.example

      - name: Publish final deployment gate status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "naasconnect/predeploy-quality-gate",
              description: state === "success"
                ? "Typecheck, production build and desktop/mobile smoke tests passed"
                : "Pre-deployment checks failed; inspect the GitHub Actions run"
            });
