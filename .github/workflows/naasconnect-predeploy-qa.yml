name: NAASCONNECT pre-deployment quality gate

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: naasconnect-predeploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Mark commit as awaiting pre-deployment checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error -X POST "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"state":"pending","context":"naasconnect/predeploy-quality-gate","description":"Typecheck, production build and browser QA are running"}'

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run production-browser checks on localhost
        run: npm run test:e2e
        env:
          CI: "true"
          BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: naasconnect-predeploy-qa-${{ github.run_number }}
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish final pre-deployment result to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=success
          DESCRIPTION="Pre-deployment checks passed"
          if [ "$JOB_STATUS" != "success" ]; then
            STATE=failure
            DESCRIPTION="Pre-deployment checks failed; Vercel preview must be skipped"
          fi
          curl --fail-with-body --silent --show-error -X POST "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -d "{\"state\":\"$STATE\",\"context\":\"naasconnect/predeploy-quality-gate\",\"description\":\"$DESCRIPTION\"}"
